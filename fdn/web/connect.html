<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>正在打通链路…</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2937;
        --ink-soft: #6b7280;
        --ink-faint: #9ca3af;
        --line: #e5e7eb;
        --accent: #059669;
        --bad: #b91c1c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.55 -apple-system, "SF Pro Text", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f8fafc;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 24px 20px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .12);
      }
      h1 { font-size: 17px; margin: 14px 0 3px; font-weight: 650; letter-spacing: .2px; }
      .sub { color: var(--ink-soft); font-size: 12.5px; margin: 0 0 14px; }
      #stage {
        font-size: 13.5px; font-weight: 600; min-height: 21px;
        color: var(--accent);
        display: inline-flex; align-items: center; gap: 7px;
      }
      #stage.bad { color: var(--bad); }
      #stage::before {
        content: ""; width: 7px; height: 7px; border-radius: 50%;
        background: currentColor; opacity: .85;
        animation: blink 1.3s ease-in-out infinite;
      }
      #stage.bad::before { animation: none; opacity: 1; }
      @keyframes blink { 0%, 100% { opacity: .85; } 50% { opacity: .28; } }
      #attempt { font-size: 11.5px; color: var(--ink-faint); min-height: 16px; margin-top: 2px; }
      #failbox { display: none; margin-top: 14px; }
      #reason {
        color: var(--bad); font-size: 11.5px; margin-bottom: 12px;
        word-break: break-word; text-align: left;
        background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 8px 10px;
      }
      .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      button {
        font: inherit; font-size: 13px; padding: 7px 15px; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
        transition: background .15s, border-color .15s;
      }
      button:hover { background: #f9fafb; border-color: #d1d5db; }
      button.primary {
        background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550;
      }
      button.primary:hover { background: #047857; border-color: #047857; }
      .diag { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); font-size: 11.5px; }
      .diag a { color: var(--ink-faint); text-decoration: none; }
      .diag a:hover { color: var(--ink-soft); }

      /* ---- the welding monster (compact) ---- */
      .scene { width: 168px; height: auto; display: block; margin: 0 auto; }

      .monster { animation: bob 2.4s ease-in-out infinite; transform-origin: 210px 240px; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }

      .arm-right { animation: weld 1.6s ease-in-out infinite; transform-origin: 246px 186px; }
      @keyframes weld { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(-3deg); } 60% { transform: rotate(1.5deg); } }

      .flame { animation: flicker .22s steps(2, jump-none) infinite; transform-origin: 228px 122px; }
      @keyframes flicker { 0% { transform: scale(1,1); opacity: .9; } 100% { transform: scale(1.06,.94); opacity: .78; } }

      .glow { animation: pulse 1.3s ease-in-out infinite; transform-origin: 210px 100px; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.1); opacity: .6; } }

      .spark { opacity: 0; animation: fly 1s ease-out infinite; }
      .spark:nth-of-type(2) { animation-delay: .16s; }
      .spark:nth-of-type(3) { animation-delay: .32s; }
      .spark:nth-of-type(4) { animation-delay: .48s; }
      .spark:nth-of-type(5) { animation-delay: .64s; }
      .spark:nth-of-type(6) { animation-delay: .26s; }
      .spark:nth-of-type(7) { animation-delay: .54s; }
      .spark:nth-of-type(8) { animation-delay: .74s; }
      @keyframes fly {
        0% { transform: translate(0,0) scale(1); opacity: 1; }
        70% { opacity: .8; }
        100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
      }

      .chain-l { animation: trembleL 1.6s ease-in-out infinite; }
      .chain-r { animation: trembleR 1.6s ease-in-out infinite; }
      @keyframes trembleL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
      @keyframes trembleR { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-1px); } }

      .weld-link { stroke-dasharray: 70; stroke-dashoffset: 70; }
      .visor { animation: visorGlow 2.2s ease-in-out infinite; }
      @keyframes visorGlow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

      /* ---- success ---- */
      .scene.done .spark, .scene.done .flame, .scene.done .glow, .scene.done .glow-core { display: none; }
      .scene.done .weld-link {
        animation: drawLink .5s ease-out forwards;
        stroke: var(--accent); filter: drop-shadow(0 0 4px rgba(5,150,105,.5));
      }
      @keyframes drawLink { to { stroke-dashoffset: 0; } }
      .scene.done .chain-l { animation: clankL .32s ease-out 1; }
      .scene.done .chain-r { animation: clankR .32s ease-out 1; }
      @keyframes clankL { 0% { transform: translateX(4px); } 100% { transform: translateX(0); } }
      @keyframes clankR { 0% { transform: translateX(-4px); } 100% { transform: translateX(0); } }
      .scene.done .monster { animation: cheer .7s ease-out 1; }
      @keyframes cheer { 0% { transform: translateY(0); } 35% { transform: translateY(-9px); } 65% { transform: translateY(0); } 85% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
      .scene.done .visor { fill: var(--accent); animation: none; }

      @media (prefers-reduced-motion: reduce) {
        .monster, .arm-right, .flame, .glow, .spark, .chain-l, .chain-r, .visor, #stage::before { animation: none !important; }
        .spark { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="scene" id="scene" viewBox="0 0 420 280" role="img" aria-label="一只小怪兽正在焊接两条铁链">
        <defs>
          <radialGradient id="g-weld" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff8e1" stop-opacity="1" />
            <stop offset="35%" stop-color="#ffc94d" stop-opacity=".8" />
            <stop offset="100%" stop-color="#ff8a00" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="g-body" cx="40%" cy="30%" r="90%">
            <stop offset="0%" stop-color="#6ee7a8" />
            <stop offset="100%" stop-color="#34a06a" />
          </radialGradient>
          <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c7cedb" />
            <stop offset="100%" stop-color="#94a0b4" />
          </linearGradient>
        </defs>

        <ellipse cx="210" cy="252" rx="110" ry="10" fill="#0f172a" opacity=".07" />

        <g class="chain-l" stroke="url(#g-metal)" stroke-width="6" fill="none">
          <ellipse cx="24"  cy="100" rx="16" ry="10" />
          <ellipse cx="50"  cy="103" rx="16" ry="10" />
          <ellipse cx="76"  cy="100" rx="16" ry="10" />
          <ellipse cx="102" cy="103" rx="16" ry="10" />
          <ellipse cx="128" cy="100" rx="16" ry="10" />
          <ellipse cx="154" cy="103" rx="16" ry="10" />
          <ellipse cx="180" cy="100" rx="16" ry="10" />
        </g>
        <g class="chain-r" stroke="url(#g-metal)" stroke-width="6" fill="none">
          <ellipse cx="240" cy="100" rx="16" ry="10" />
          <ellipse cx="266" cy="103" rx="16" ry="10" />
          <ellipse cx="292" cy="100" rx="16" ry="10" />
          <ellipse cx="318" cy="103" rx="16" ry="10" />
          <ellipse cx="344" cy="100" rx="16" ry="10" />
          <ellipse cx="370" cy="103" rx="16" ry="10" />
          <ellipse cx="396" cy="100" rx="16" ry="10" />
        </g>
        <ellipse class="weld-link" cx="210" cy="100" rx="15" ry="9" fill="none" stroke="#ffc94d" stroke-width="6" />

        <g class="glow">
          <circle class="glow-core" cx="210" cy="100" r="24" fill="url(#g-weld)" />
        </g>

        <g fill="#ffd166">
          <circle class="spark" cx="210" cy="100" r="2.2" style="--dx:-26px; --dy:-20px" />
          <circle class="spark" cx="210" cy="100" r="1.7" style="--dx: 23px; --dy:-23px" fill="#ff9d3c" />
          <circle class="spark" cx="210" cy="100" r="1.9" style="--dx: 30px; --dy: -6px" />
          <circle class="spark" cx="210" cy="100" r="1.5" style="--dx:-32px; --dy:  5px" fill="#fff3c4" />
          <circle class="spark" cx="210" cy="100" r="2.0" style="--dx: 12px; --dy:-30px" fill="#ff9d3c" />
          <circle class="spark" cx="210" cy="100" r="1.6" style="--dx:-14px; --dy:-33px" fill="#fff3c4" />
          <circle class="spark" cx="210" cy="100" r="1.8" style="--dx: 33px; --dy:-14px" fill="#ff9d3c" />
          <circle class="spark" cx="210" cy="100" r="1.4" style="--dx:-29px; --dy:-11px" />
        </g>

        <g class="monster">
          <rect x="186" y="234" width="16" height="18" rx="7" fill="#2f7d4c" />
          <rect x="218" y="234" width="16" height="18" rx="7" fill="#2f7d4c" />
          <ellipse cx="210" cy="204" rx="52" ry="42" fill="url(#g-body)" />
          <ellipse cx="210" cy="216" rx="30" ry="20" fill="#d9fbe8" opacity=".5" />
          <path d="M178 172 l-8 -14 l16 6 Z" fill="#ffd166" />
          <path d="M242 172 l8 -14 l-16 6 Z" fill="#ffd166" />
          <rect x="170" y="176" width="80" height="30" rx="13" fill="#3f4756" />
          <rect x="179" y="185" width="62" height="11" rx="5.5" class="visor" fill="#ffb020" />
          <line x1="170" y1="184" x2="160" y2="192" stroke="#3f4756" stroke-width="5" stroke-linecap="round" />
          <line x1="250" y1="184" x2="260" y2="192" stroke="#3f4756" stroke-width="5" stroke-linecap="round" />
          <path d="M196 224 Q 210 234 224 224" stroke="#1c5c38" stroke-width="4" fill="none" stroke-linecap="round" />
          <path d="M160 206 Q 140 214 134 200" stroke="#34a06a" stroke-width="13" fill="none" stroke-linecap="round" />
          <g class="arm-right">
            <path d="M258 200 Q 252 168 240 146" stroke="#34a06a" stroke-width="13" fill="none" stroke-linecap="round" />
            <g transform="rotate(24 240 146)">
              <rect x="231" y="138" width="26" height="9" rx="3" fill="#4b5563" />
              <polygon class="flame" points="231,142 212,138 216,146 210,150 231,147" fill="#7fd4ff" />
            </g>
          </g>
        </g>
      </svg>

      <h1 id="title">正在打通内网链路</h1>
      <p class="sub">浏览器 ⇋ 内网，直连中</p>
      <div id="stage">准备中…</div>
      <div id="attempt"></div>

      <div id="failbox">
        <div id="reason"></div>
        <div class="actions">
          <button class="primary" id="btn-retry">再试一次</button>
          <button id="btn-enter">直接进入</button>
        </div>
      </div>

      <div class="diag"><a id="diag-link" href="#">打开诊断页 →</a></div>
    </div>

    <script type="module" src="/src/connect.ts"></script>
  </body>
</html>
